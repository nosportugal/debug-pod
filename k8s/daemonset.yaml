apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: debug-pod
  namespace: kube-system
  labels:
    app: debug-pod
spec:
  selector:
    matchLabels:
      name: debug-pod
  template:
    metadata:
      labels:
        name: debug-pod
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      hostPID: true
      hostIPC: true
      hostNetwork: true
      tolerations:
      - operator: Exists
      containers:
      - name: debug-pod
        securityContext:
          privileged: true
        image: ghcr.io/nosportugal/debug-pod:master
        command: [ "sleep", "infinity" ]
        resources:
          requests:
            memory: "0"
            cpu: "0"
          limits:
            memory: "500Mi"
            cpu: "500m"
        volumeMounts:
          - name: host
            mountPath: /host
          - name: containerd
            mountPath: /run/containerd/containerd.sock
      terminationGracePeriodSeconds: 0
      volumes:
        - name: host
          hostPath:
            path: /
        - name: containerd
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 100%
    type: RollingUpdate
